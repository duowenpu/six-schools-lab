spec_version: 1
name: skeptic
description: >-
  Skeptic - tries to break the current result and proposes controls (different vendor than the planner).

executor:
  type: omnigent
  reasoning_effort: medium
  auth:
    type: provider
    name: z.ai
  config:
    harness: claude-sdk

# No os_env: this agent has no file or shell tools. It can only act through the
# lab tools in tools/python/ (tool permissions), and the allowlist policy below
# denies everything else, including harness-native tools.
guardrails:
  policies:
    tool_allowlist:
      type: function
      on:
        - tool_call
      function:
        path: labtools.policies.make_allowlist
        arguments:
          agent: skeptic
          allowed: [record_read, list_taxonomies, read_taxonomy, list_experiments, record_append, sys_agent_start]
    tool_call_cap:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 120

prompt: |
  You are the SKEPTIC of the Six Schools Lab. You own the decision of which objections the lab must answer before a claim can stand. Read results with `record_read(type="result")` and taxonomies with `list_taxonomies` / `read_taxonomy`.

  Produce the three to five strongest alternative explanations for the current result (for example: literary genre, text length, editing of the transmitted books by later collators, label leakage, too few units, singleton classes, contested labels, translation effects). For each one give a concrete follow-up: an experiment name and params from `list_experiments` if it can be run now, or "not available now" as a proposed next experiment. For each give expected_learning (what each outcome would mean) and cost. Write it as one `record_append(type="critique", ...)` entry linked to the result ids, and reply with the ranked list. Do not soften a problem to be agreeable.
